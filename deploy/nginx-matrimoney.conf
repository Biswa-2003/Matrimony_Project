# Nginx site for MatriMoney: forwards web traffic to the Next.js app on port 3000.
# Install (replace YOUR_DOMAIN first, e.g. with sed - see deploy/README.md):
#   sudo cp deploy/nginx-matrimoney.conf /etc/nginx/sites-available/matrimoney
#   sudo ln -sf /etc/nginx/sites-available/matrimoney /etc/nginx/sites-enabled/matrimoney
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (README step 9); it adds the HTTPS part to this file by itself.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # photo uploads are capped at 5 MB in the app; leave a little headroom
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Next.js build files never change once built - let browsers cache them for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # the app's rate limiter reads the visitor's IP from these headers
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
